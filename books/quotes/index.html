const QUOTES=[{"s": "heenan", "t": "Единственной его нормальностью, за которую я любила его еще больше, была его любовь к матери и бабушке.", "c": 0, "p": 14, "ch": "Вступительное слово и предисловие"}, {"s": "heenan", "t": "Когда я не мог быть дома в День Благодарения, Джек всегда приглашал меня на ужин со своей семьей.", "c": 11, "p": 20, "ch": "Глава 11. Семья и Фанаты"}, {"s": "heenan", "t": "Не знаю, как вы, но с того дня я больше всего в жизни полюбил кататься по мокрому от медвежьей мочи полу!", "c": 2, "p": 78, "ch": "Глава 2. Ранние годы"}, {"s": "heenan", "t": "В то время Ник в качестве коронного приема использовал захват «четверку», но наносил больше вреда себе, чем оппоненту, как было и когда он использовал «Восточный слипер».", "c": 3, "p": 141, "ch": "Глава 3. Рождение «Мозга»"}, {"s": "heenan", "t": "Верн не делал Грега чемпионом, потому что хотел, чтобы в семье Ганье был только один мировой чемпион.", "c": 4, "p": 31, "ch": "Глава 4. Возвращение в AWA"}, {"s": "heenan", "t": "Он вышел с завода, где упорно трудился за гроши, и всегда считал, что единственной целью каждого промоутера было подставить его.", "c": 3, "p": 102, "ch": "Глава 3. Рождение «Мозга»"}, {"s": "heenan", "t": "Фанаты постоянно подходили к нему с вопросами: «Какой у тебя рост?», «Сколько ты весишь?» или «А ты правда Гигант Андре?»", "c": 6, "p": 9, "ch": "Глава 6. Из менеджера в комментаторы"}, {"s": "heenan", "t": "— Тебе надо написать книгу «Я причина больных коленей Джо Нэймита», потому что сквозь тебя может пройти любой (Джо Нэймит — популярнейший квотербек Нью Йорк Джетс, член зала славы NFL).", "c": 11, "p": 127, "ch": "Глава 11. Семья и Фанаты"}, {"s": "heenan", "t": "В тот вечер в Garden я встретил Винса впервые после боя Иноки–Али, но я допустил ошибку, закурив сигару.", "c": 5, "p": 5, "ch": "Глава 5. Переход в WWF"}, {"s": "heenan", "t": "Я знавал агонию, когда тебе мало платят, и я испытывал приятные ощущения, получая больше, чем ожидал, хотя это происходило нечасто.", "c": 12, "p": 29, "ch": "Глава 12. Раскидывая мозгами"}, {"s": "heenan", "t": "Гостиница кормила зрителей ужином прямо во время матчей, которые всегда заканчивались чисто, без дисквалификаций.", "c": 2, "p": 88, "ch": "Глава 2. Ранние годы"}, {"s": "heenan", "t": "Я помню, как Джордж Захориан, врач, которого признали виновным по другому делу, появлялся в Херши в длинном, белом халате с двумя большими чемоданами.", "c": 7, "p": 3, "ch": "Глава 7. Трудные решения"}, {"s": "heenan", "t": "Но для противостояния Хогана и Боквинкля пришлось арендовать соседнюю арену и показывать матч на большом экране, словно в кино.", "c": 5, "p": 33, "ch": "Глава 5. Переход в WWF"}, {"s": "heenan", "t": "У нас были взлеты и падения в жизни, но Бобби всегда мог рассмешить нас… и мы смеялись вместе.", "c": 0, "p": 17, "ch": "Вступительное слово и предисловие"}, {"s": "piper", "t": "Поначалу мне нравился его настрой, но со временем я начал понимать, что его больше волновало, как бы вытащить из меня побольше денег.", "c": 1, "p": 9, "ch": "Глава 1"}, {"s": "piper", "t": "Я понял, что чем сильнее выставляешь противника, тем более впечатляющей будет победа в глазах фанатов.", "c": 5, "p": 11, "ch": "Глава 5. Шарлотт"}, {"s": "piper", "t": "Он выдал лучшее 30-секундное промо в своей жизни (и где эта камера, когда она нужна больше всего?), держа в правой руке оружие.", "c": 12, "p": 53, "ch": "Глава 12. Болезнь"}, {"s": "piper", "t": "Мне было плевать: если потребовалось бы заехать в тундру ради денег, это все равно было лучше, чем играть на волынке за углом ради четвертака.", "c": 14, "p": 2, "ch": "Глава 14. Родди становится буйным"}, {"s": "piper", "t": "Я являюсь большим поклонником их обоих; я прекрасно осознаю значимость их роли в том, чтобы в свое время начался настоящий рестлинг-бум.", "c": 0, "p": 27, "ch": "Предисловие"}, {"s": "piper", "t": "И вот я, рестлер, оказался в одном лагере с настоящими боксерами, набирающими форму перед настоящими матчами.", "c": 10, "p": 2, "ch": "Глава 10. WrestleMania 2"}, {"s": "piper", "t": "Следующую важную победу в Шарлотт я одержал над рестлером, который любит говорить: «Если хочешь стать мужчиной, ты должен победить мужчину!»", "c": 5, "p": 12, "ch": "Глава 5. Шарлотт"}, {"s": "piper", "t": "В вечер перед дачей показаний в суде я прибыл на небольшую арену в Пенсильвании на плановое шоу, и Винс дал указания, чтобы я принял удержание.", "c": 11, "p": 23, "ch": "Глава 11. Суд Присяжных"}, {"s": "piper", "t": "Мне пришлось работать на Северо-западе вопреки своему желанию, но быстро понимаешь, что семья всегда будет самым важным в твоей жизни.", "c": 9, "p": 44, "ch": "Глава 9. WrestleMania"}, {"s": "piper", "t": "Я знал, что могу заставить все выглядеть по-настоящему, не нанося настоящего удара, но не мог забыть слов шишки из WWF, что «конец ее карьеры стал бы началом моей».", "c": 8, "p": 26, "ch": "Глава 8. the War to Settle the Score"}, {"s": "piper", "t": "Он считал рестлинг ненастоящим, а рестлеров — клоунами; он не понимал, что стоит в одном ринге с настоящим профессиональным рестлером, который никогда не отступает от своих идеалов.", "c": 7, "p": 45, "ch": "Глава 7. Годы в Нью Йорке"}, {"s": "piper", "t": "Все мои братья по-разному относились к жизни, при этом они испытывали сильнейшее давление, день за днем.", "c": 12, "p": 40, "ch": "Глава 12. Болезнь"}, {"s": "piper", "t": "Много раз я оказывался в ситуациях, когда пугался до смерти, много раз были ситуации, когда наоборот, я пугал окружающих столь же сильно.", "c": 1, "p": 22, "ch": "Глава 1"}, {"s": "piper", "t": "В результате большая часть фанатов в тот день решила не терять время на просмотр матча, исход которого большинству был ясен.", "c": 4, "p": 62, "ch": "Глава 4. Портлендские годы"}, {"s": "copeland", "t": "Хотя некоторые из моей семьи и друзей смеялись и сомневались в моём выборе карьеры, я продолжал стоять на своём.", "c": 24, "p": 0, "ch": "Глава 22"}, {"s": "copeland", "t": "После возвращения из Теннесси, мама долго откармливала меня, готовя к еще более жесткому зимнему туру смерти.", "c": 24, "p": 0, "ch": "Глава 22"}, {"s": "copeland", "t": "Я работал на ипподроме, просиживая в небольшой неотапливаемой каморке, и брал деньги за парковку.", "c": 10, "p": 8, "ch": "Глава 8"}, {"s": "copeland", "t": "Он всегда был в состоянии залезть людям под кожу (я думаю, что это его особый дар в жизни), но участвуя в этих турнирах он использовал своё умение раздражать на полную мощность.", "c": 19, "p": 3, "ch": "Глава 17"}, {"s": "copeland", "t": "Наконец, я сказал, что хочу остаться в памяти как человек, который заставлял своих фанов улыбаться, и который всегда хорошо относился к молодым парням в бизнесе.", "c": 1, "p": 0, "ch": "Предисловие Мика Фоли"}, {"s": "copeland", "t": "В общем, байкеры нас заметили — может, их привлек громкий топот пяти больших мужчин, ломившихся через подлесок, может, они заметили яркие цветочки на наших простынях.", "c": 18, "p": 6, "ch": "Глава 16"}, {"s": "copeland", "t": "Я всегда говорил себе, что небуду делать это, пока не будет серьезной необходимости добавить драмы и накала.", "c": 25, "p": 13, "ch": "Глава 23"}, {"s": "copeland", "t": "Большинство людей назвали меня ослом (большинство и до сих пор так называют), но мне было двадцать три, и это была моя мечта.", "c": 26, "p": 8, "ch": "Глава 24"}, {"s": "copeland", "t": "Эй, по крайней мере, я избежал огня, но всё равно это было чертовски больно, так что Джерри не нужно было накладывать вето на то, что я сделал.", "c": 32, "p": 8, "ch": "Глава 30"}, {"s": "copeland", "t": "Я всегда ненавидел, когда парни выглядят, словно они зашли с улицы и наткнулись на ринг.", "c": 27, "p": 12, "ch": "Глава 25"}, {"s": "copeland", "t": "На самом деле, Форд Таурус семьи Ресо, ласково зовущийся Тоби, регулярно курсировал до Мотауна и обратно вместе с нами на борту.", "c": 21, "p": 6, "ch": "Глава 19"}, {"s": "copeland", "t": "Вообще помню, в этой квартире было довольно много классических элементов, которые с надлежащими деньгами могли бы выглядеть солидно.", "c": 6, "p": 1, "ch": "Глава 4"}, {"s": "copeland", "t": "В общем, наше большое путешествие все же закончилось и мне пришлось вернуться к нервному ожиданию окончания конкурса эссе.", "c": 12, "p": 7, "ch": "Глава 10"}, {"s": "copeland", "t": "Даже в юном возрасте моей целью было не соглашаться с выбором между этими вариантами, а стремится к чему-то лучшему.", "c": 4, "p": 3, "ch": "Глава 2"}, {"s": "flair", "t": "Как и большинство лиг в то время, шарлоттская территория была частью огромного Национального Альянса Рестлинга (NWA).", "c": 2, "p": 12, "ch": "Глава 3. Мистер Харизма"}, {"s": "flair", "t": "Рикки Стимбоат: Харли послал Дэвида Крокетта за бумагой, и тот вернулся со здоровым листом грубого наждака.", "c": 4, "p": 22, "ch": "Глава 5. Как такой придурок, как ты, вписывается в мои планы?"}, {"s": "flair", "t": "В AWA выйти из роли и общаться с рестлером, который победил тебя на телевидении считалось оскорблением всей индустрии.", "c": 1, "p": 35, "ch": "Глава 2. Врываясь в бизнес"}, {"s": "flair", "t": "Однажды по дороге на запись промо я услышал по радио песню Джерри Ли Льюиса «Большие огненные шары» и обратил внимание на его выкрик «Ууу!» в середине песни.", "c": 2, "p": 21, "ch": "Глава 3. Мистер Харизма"}, {"s": "flair", "t": "Несколько человек держали меня за руки, и Харли сказал: «Парень, сейчас будет больно.»", "c": 4, "p": 22, "ch": "Глава 5. Как такой придурок, как ты, вписывается в мои планы?"}, {"s": "flair", "t": "Мои родители не были уверены, что, став рестлером, я сделал правильный выбор карьеры.", "c": 1, "p": 27, "ch": "Глава 2. Врываясь в бизнес"}, {"s": "flair", "t": "Гонсалес заявил, что Броди напал на него, а он только защищался, и в конце концов суд оправдал его.", "c": 5, "p": 2, "ch": "Глава 6. Я не настолько глуп"}, {"s": "flair", "t": "Джимми позаботился о том, чтобы кроме 35 тысяч страховки, я получал еще какую-то сумму.", "c": 3, "p": 8, "ch": "Глава 4. Человек, который спас рестлинг"}, {"s": "flair", "t": "В то время рестлерам на нашей территории приходилось ежедневно и по многу часов проводить в дороге — например, до Ричмонда было триста миль, а до Норфолка еще больше.", "c": 3, "p": 0, "ch": "Глава 4. Человек, который спас рестлинг"}, {"s": "flair", "t": "Одна женщина, содержавшаяся в Западной больнице штата, каждый год рожала нового ребенка от других больных.", "c": 0, "p": 0, "ch": "Глава 1. Дитя черного рынка"}, {"s": "flair", "t": "Он, Громила Дик и Рейс были самыми большими именами, с которыми мне пришлось работать в этом городе.", "c": 5, "p": 2, "ch": "Глава 6. Я не настолько глуп"}, {"s": "flair", "t": "Из-за всех махинаций, проворачивавшихся в обществе детских домов Теннесси я никогда толком не узнал деталей относительно моего рождения или того, что произошло сразу после него.", "c": 0, "p": 1, "ch": "Глава 1. Дитя черного рынка"}, {"s": "wcw", "t": "Ему было всего лишь 37, и он был настолько бодрым и дружелюбным человеком, что в понедельник соболезнования его семье выразили не только на Nitro, но и на Raw (где он никогда не работал).", "c": 6, "p": 130, "ch": "Глава 5. 1999, В поисках спасителя"}, {"s": "wcw", "t": "Рейтинги, публикуемые во вторник утром, оправдывали любые действия, как оправдывали их количество купленных PPV и проданных билетов.", "c": 1, "p": 18, "ch": "Введение"}, {"s": "wcw", "t": "Бой Збышко и Бишоффа должен был решить судьбу Nitro: в случае победы Ларри Nitro останется под контролем WCW.", "c": 4, "p": 59, "ch": "Глава 3. 1997, Выжидательная тактика"}, {"s": "wcw", "t": "Хуже того, потом у него был «ненастоящий матч» с Ла Паркой (да, ненастоящий матч в ненастоящем спорте), в котором он «поддался».", "c": 6, "p": 145, "ch": "Глава 5. 1999, В поисках спасителя"}, {"s": "wcw", "t": "Едва лишь комментаторы отметили, что соотношение его побед и поражений 60-0, фанаты, у которых все было в порядке со свободным временем, принялись вести свою статистику.", "c": 5, "p": 56, "ch": "Глава 4. 1998: Инерция — сила"}, {"s": "wcw", "t": "Это интервью выполнило свою миссию: почти семь миллионов зрителей потратили зря 18 минут своих жизней, но все же посмотрели этот сегмент.", "c": 5, "p": 87, "ch": "Глава 4. 1998: Инерция — сила"}, {"s": "wcw", "t": "Их интервью больше напоминали шут (т.е., всамделишные речи), таких полуправдивых комментариев еще не делал никто.", "c": 3, "p": 56, "ch": "Глава 2. 1996: И началась война"}, {"s": "wcw", "t": "Зрителей больше интересовал сюжет с nWo, и Бишофф решил, что nWo имеет больше шансов против Raw, чем WCW.", "c": 3, "p": 75, "ch": "Глава 2. 1996: И началась война"}, {"s": "wcw", "t": "Бишофф и вправду верил, что Хоган и есть про-рестлинг, потому что в течение многих лет именно так и было.", "c": 0, "p": 9, "ch": "Предисловие"}, {"s": "wcw", "t": "Прельстившись большими деньгами, предлагаемыми WCW, Флэр пошел прямо к МакМэну и попросил отпустить его.", "c": 2, "p": 82, "ch": "Глава 1. 1988-1996: Малыш Мистера Тернера"}, {"s": "wcw", "t": "Компания продолжала терять деньги, но Бишофф не хотел признавать поражение; в конце концов, если бы он стал первым, кто сделает WCW прибыльной, он получит больше власти и денег.", "c": 2, "p": 112, "ch": "Глава 1. 1988-1996: Малыш Мистера Тернера"}, {"s": "wcw", "t": "С помощью комбинации жестоких деловых методов, гениального маневрирования и чистой удачи к концу 80-х он уже зарабатывал деньги, о которых другие и не мечтали.", "c": 9, "p": 72, "ch": "Эпилог: Плевок в могилу"}, {"s": "wcw", "t": "И, что более важно, WCW была бы восстановлена, было бы больше PPV, больше домашних шоу, больше сувенирной продукции.", "c": 9, "p": 54, "ch": "Эпилог: Плевок в могилу"}, {"s": "wcw", "t": "Они пошли в стрип-клуб, а Дэвид делал вид, что никогда в жизни не видел голой женщины.", "c": 7, "p": 113, "ch": "Глава 6. Все рушится"}, {"s": "eddie", "t": "Это оказалось идеальным времяпрепровождением, которым можно было заниматься в одиночестве или со всей семьей.", "c": 19, "p": 5, "ch": "Глава 19"}, {"s": "eddie", "t": "Какими бы сильными ни были наши разногласия, она никогда не отрицала моих прав, как отца.", "c": 36, "p": 17, "ch": "Глава 36"}, {"s": "eddie", "t": "Я оказался в WCW, эту возможность я всегда хотел получить, но никогда в нее не верил.", "c": 17, "p": 2, "ch": "Глава 17"}, {"s": "eddie", "t": "Сайама был невероятно талантлив и стал настоящим пионером стиля полутяжеловесов — он летал над рингом, обманывал смерть и осуществлял революцию своими харизмой и набором приемов.", "c": 13, "p": 2, "ch": "Глава 13"}, {"s": "eddie", "t": "Только сильный мужчина может проглотить свою гордость и делать то, что необходимо для его семьи.", "c": 9, "p": 55, "ch": "Глава 9"}, {"s": "eddie", "t": "— Приезжай, — ответил Тури, как всегда предлагая мне свою любовь и гостеприимство безо всяких вопросов.", "c": 33, "p": 23, "ch": "Глава 33"}, {"s": "eddie", "t": "И хотя Ред и я победили, братья Максимо взяли микрофон, чтобы признаться в любви и уважении ко мне.", "c": 34, "p": 54, "ch": "Глава 34"}, {"s": "eddie", "t": "Я не думаю, что он любил это занятие, но занимался им на все 100 процентов, как и всегда в жизни.", "c": 4, "p": 11, "ch": "Глава 4"}, {"s": "eddie", "t": "Такое происходит постоянно — рестлеры всегда в разъездах, зарабатывают деньги на жизнь, пока их дети рождаются и растут.", "c": 16, "p": 54, "ch": "Глава 16"}, {"s": "eddie", "t": "Я испытывал постоянный страх, сопровождаемый сильными паническими атаками, особенно в ночное время.", "c": 33, "p": 26, "ch": "Глава 33"}, {"s": "eddie", "t": "Дошло до того, что они больше боялись за мою жизнь, а не за то, что руководство узнает о моих проблемах.", "c": 31, "p": 8, "ch": "Глава 31"}, {"s": "eddie", "t": "Конечно, это их работа, за которую они получают хорошие деньги, но в том месте ощущается огромная любовь.", "c": 32, "p": 1, "ch": "Глава 32"}, {"s": "eddie", "t": "Стоя на ринге, впитывая безумную любовь фанатов и коллег по цеху, я почувствовал, что Бог ответил на мои молитвы.", "c": 34, "p": 58, "ch": "Глава 34"}, {"s": "eddie", "t": "А когда вы знаете друг друга уже на личном уровне, это открывает больше возможностей и дает больше взаимопонимания в ринге.", "c": 41, "p": 14, "ch": "Глава 41"}, {"s": "hart", "t": "Как бы сильно Брюсу ни был необходим прорыв, Оуэн был лучшим исполнителем и больше заслуживал такого шанса.", "c": 30, "p": 40, "ch": "Глава 30. Одинокий волк"}, {"s": "hart", "t": "Я же думал: «Настоящая драма произошла со мной, а не с тобой, ради всего святого, посмотри на меня, Дэйви!»", "c": 27, "p": 65, "ch": "Глава 27. Слушай меня, я вытащу"}, {"s": "hart", "t": "Чем больше мы говорили, тем больше я расстраивался, особенно, когда я вспомнил ее прощальную речь: «Еще наступит час расплаты.", "c": 46, "p": 4, "ch": "Глава 46. Раздражая Бога"}, {"s": "hart", "t": "В то воскресенье все рестлеры играли благотворительный матч в бейсбол, организованный местной радиостанцией, в обмен на несколько бесплатных анонсов шоу в эфире радио.", "c": 10, "p": 3, "ch": "Глава 10. Ковбой видит мир"}, {"s": "hart", "t": "Будучи дочерью настоящего борца да и просто девчонкой из Оклахомы, Майк не оставила бы шансов Бифкейку, и он знал это!", "c": 24, "p": 44, "ch": "Глава 24. Разбитый и без денег"}, {"s": "hart", "t": "Когда мы только начали встречаться, мы всегда мечтали о четырех детях, поэтому я был счастлив.", "c": 23, "p": 31, "ch": "Глава 23. Возмездие за грех"}, {"s": "hart", "t": "Я пошел на слушания без страха сказать правду и готовый ко всему, но, естественно, все, что произошло за теми стенами, должно остаться тайной.", "c": 30, "p": 36, "ch": "Глава 30. Одинокий волк"}, {"s": "hart", "t": "Оуэн и я не имели понятия, когда и при каких обстоятельствах мы сможем работать вместе, и я пошутил: «Не бойся, у нас еще состоится бой не на жизнь, а на смерть».", "c": 34, "p": 21, "ch": "Глава 34. Клика"}, {"s": "hart", "t": "Я не опасался поддерживать Марту, которая хотела заставить WWF жестоко заплатить за крушение ее жизни и смерть мужа.", "c": 43, "p": 42, "ch": "Глава 43. Если в твоих руках окажется моя жизнь, ты не уронишь ее?"}, {"s": "hart", "t": "Бриско подлизывался ко мне, притворяясь моим старым другом, одним из парней, и, поскольку особого выбора у меня не было, я постарался доверять ему.", "c": 34, "p": 49, "ch": "Глава 34. Клика"}, {"s": "hart", "t": "Я был поражен, когда Эрик выбросил матч Харт–Хоган на бесплатном Nitro 28 сентября — этот матч принес бы огромные деньги на PPV, ведь зрители ждали его много лет.", "c": 42, "p": 63, "ch": "Глава 42. Жертвы войны"}, {"s": "hart", "t": "Это стало нормой у нас: то небольшое время, которое я проводил дома, было омрачено ее страхом от того, то я вскоре снова уеду.", "c": 16, "p": 58, "ch": "Глава 16. Начало работы в WWF"}, {"s": "hart", "t": "Вид всей семьи Хартов на первом ряду, окруженной развевающимися канадскими флагами, заставлял мое сердце биться в груди, как барабан.", "c": 39, "p": 43, "ch": "Глава 39. Что бы ни случилось, ты можешь на меня рассчитывать"}, {"s": "hart", "t": "Его девушка заметила, как я вхожу в больницу, после чего они с братом усадили Антуана в инвалидное кресло и догнали меня в отделении радиологии.", "c": 45, "p": 67, "ch": "Глава 45. Последний Танец"}, {"s": "goldust", "t": "Он занимался одновременно и подбором рестлеров и продвижением себя, что означало, что всегда находились недовольные по тем или иным причинам.", "c": 1, "p": 17, "ch": "Глава 1. Болезнь"}, {"s": "goldust", "t": "Я стал очень самокритичным в отношении своих выступлений, из-за этого я испытываю сильную неуверенность.", "c": 3, "p": 39, "ch": "Глава 3. По стопам"}, {"s": "goldust", "t": "Каждый день до конца своей жизни я буду относиться к вам с уважением, почтением и любовью.", "c": 0, "p": 16, "ch": "Предисловие, вводные слова"}, {"s": "goldust", "t": "Мой отец всегда говорил мне, что некоторые из моих движений очень похожи на движения Барри.", "c": 2, "p": 21, "ch": "Глава 2. Обучение"}, {"s": "goldust", "t": "В течение восьми месяцев–года я работал вместе с Джерри Джарреттом, Джеффом Джарреттом, Джерри Лоулером и еще несколькими большими звездами.", "c": 3, "p": 23, "ch": "Глава 3. По стопам"}, {"s": "goldust", "t": "Я не всегда следовал этому совету в юности, но со временем научился держать себя в руках в таких ситуациях.", "c": 2, "p": 11, "ch": "Глава 2. Обучение"}, {"s": "goldust", "t": "Огромное спасибо всем тем, кто переводил разные книги для публикации на VS, этот вклад в жизнь сайта просто неоценим.", "c": 0, "p": 1, "ch": "Предисловие, вводные слова"}, {"s": "goldust", "t": "Отец всегда исправно выплачивал алименты, но все-таки тогда он был еще очень молод, и не думаю, что ему было какое-то до нас дело.", "c": 1, "p": 8, "ch": "Глава 1. Болезнь"}, {"s": "jericho", "t": "Пол всегда говорил прямо и я ценил это, поэтому, согласившись с ним, я решил больше об этом не думать.", "c": 23, "p": 24, "ch": "Глава 21. Неоспоримый Чемпион Мира"}, {"s": "jericho", "t": "Я понятия не имел, кому в итоге достанется победа; я был почтен уже тем, что Винс посчитал меня достойным побороться за большой приз.", "c": 23, "p": 21, "ch": "Глава 21. Неоспоримый Чемпион Мира"}, {"s": "jericho", "t": "Я в страхе забрался на вершину клетки, и там Хантер так сильно ударил меня по голове этой штукой, что, в итоге, колючая проволока застряла в моих волосах.", "c": 27, "p": 23, "ch": "Глава 25. Клуб Любителей Желе"}, {"s": "jericho", "t": "Я еще никогда не побеждал Игрока (тот матч в The State College не в счет) и поэтому был приятно удивлен решением руководства, дать мне эту победу.", "c": 18, "p": 4, "ch": "Глава 16. Город, в котором все началось…"}, {"s": "jericho", "t": "В конце концов, приготовления к моему громкому дебюту в компании повесили на меня мишень большую, чем большой Вальбовски Вала Вениса.", "c": 3, "p": 17, "ch": "Глава 1. Заносчивый придурок"}, {"s": "jericho", "t": "«Ну что твои мечты стать следующим Фонзом разбиты?» и «Как ты будешь ловить машины чтобы добраться до дома после шоу?» или «Подними большой палец, Чайна, все будет хорошо!»", "c": 6, "p": 14, "ch": "Глава 4. Работаю за еду!"}, {"s": "jericho", "t": "Я не беспокоился о том, поставлю ли ему синяк или очень сильно ударю, потому что знал, что ему все равно и он всегда даст сдачи, рано или поздно.", "c": 8, "p": 47, "ch": "Глава 6. Интерконтинентальные проблемы"}, {"s": "jericho", "t": "С помощью переводчика, он сказал мне, что является большим фанатом WWE и мечтает однажды стать рестлером.", "c": 29, "p": 24, "ch": "Глава 27. Украсть шоу"}, {"s": "jericho", "t": "Я решил не лететь на SmackDown!, пока не узнаю больше, потому что я все больше убеждался, что случилось нечто ужасное.", "c": 48, "p": 70, "ch": "Глава 46. Бенуа"}, {"s": "jericho", "t": "Я заслужил все, что получил; учитывая, что я мог убить себя или кого-нибудь, это была небольшая цена и хороший урок на всю жизнь.", "c": 45, "p": 83, "ch": "Глава 43. Блюз Хилл Стрит"}, {"s": "jericho", "t": "Тем не менее, я никогда не пропускал большие семейные праздники и, в тот день, отменил все дела, чтобы отпраздновать самый первый день рождения своего малыша в кругу семьи.", "c": 36, "p": 1, "ch": "Глава 34. Скамейка запасных"}, {"s": "jericho", "t": "Чем больше я думал о том матче, тем больше он мне нравился, и я горел желанием услышать мнение Винса на этот счет.", "c": 7, "p": 6, "ch": "Глава 5. Молодо-зелено"}, {"s": "jericho", "t": "Важно то, что я всегда буду помнить его как человека, оказавшего на меня наибольшее влияние в рестлинге и на которого я хотел быть похожим.", "c": 48, "p": 124, "ch": "Глава 46. Бенуа"}, {"s": "jericho", "t": "Мне не верилось в то, что вирус «Y2K» может привести к концу света, и все же я достаточно много слушал Арта Белла в его ночных радио-эфирах, просто на случай, если что-то и вправду случится.", "c": 15, "p": 1, "ch": "Глава 13. Любовь на полную громкость"}, {"s": "lesnar", "t": "Я много думал о том поражении 3-2 и, наконец, осознал, что я никогда не выиграю ничего значительного, если буду относиться к оппоненту с таким почтением.", "c": 4, "p": 33, "ch": "Глава 4. Крюк на пути к чемпионству NCAA"}, {"s": "lesnar", "t": "Если я выходил на борцовский ковер для спарринга, то только за победой, и победой уверенной.", "c": 5, "p": 1, "ch": "Глава 5. Четвертый год в колледже"}, {"s": "lesnar", "t": "Поражение от Фрэнка стало одним из худших моментов в моей жизни, ведь я проиграл человеку, который не заслуживал победы надо мной, он не заслуживал просто находиться со мной в восьмиугольнике.", "c": 19, "p": 33, "ch": "Глава 19. Внимание Даны Уайта"}, {"s": "lesnar", "t": "В больнице меня заверили, что у меня не обнаружили внутренних кровотечений, зато перечислили длинный список травм, которые я получил.", "c": 15, "p": 25, "ch": "Глава 15. Меч у горла"}, {"s": "lesnar", "t": "UFC — наиболее профессиональная организация, где руководство имеет достаточно ресурсов, чтобы проводить крупные интересные бои за большие деньги.", "c": 18, "p": 5, "ch": "Глава 18. Начало карьеры в смешанных единоборствах"}, {"s": "lesnar", "t": "Я хотел кормить свою семью, давать моим родителям и моим детям самую лучшую жизнь, какую только мог обеспечить, и уйти, пока я еще относительно молод и здоров.", "c": 8, "p": 32, "ch": "Глава 8. Следующая звезда"}, {"s": "lesnar", "t": "Дорога от канадской больницы до Бисмарка заняла 4 часа, в течение которых меня сопровождала невыносимая боль.", "c": 22, "p": 37, "ch": "Глава 22. Что со мной не так?"}, {"s": "lesnar", "t": "Оказавшись в больнице под морфием, я был беспомощен и ненавидел каждую секунду в этом состоянии.", "c": 22, "p": 26, "ch": "Глава 22. Что со мной не так?"}, {"s": "lesnar", "t": "Он был действительно одним из великих, и он заслуживает большого уважения за то, что делал.", "c": 8, "p": 38, "ch": "Глава 8. Следующая звезда"}, {"s": "lesnar", "t": "На своем первом в жизни шоу, показанном по системе PPV, в уже не помню каком городе, я победил Джеффа Харди в андеркарде и получил, как мне тогда казалось, очень неплохую сумму.", "c": 9, "p": 14, "ch": "Глава 9. Рок и Гробовщик"}, {"s": "lesnar", "t": "WWE предложили мне гарантированные деньги, включая большой бонус за подписание контракта, без дополнительных условий.", "c": 5, "p": 38, "ch": "Глава 5. Четвертый год в колледже"}, {"s": "lesnar", "t": "Слава и известность уходят, а деньги могут помочь тебе и твоей семье достичь лучшей жизнь.", "c": 9, "p": 23, "ch": "Глава 9. Рок и Гробовщик"}, {"s": "lesnar", "t": "К несчастью, мне так и не представился шанс сбить Большую Голову с плеч, потому что кто-то опередил меня.", "c": 18, "p": 31, "ch": "Глава 18. Начало карьеры в смешанных единоборствах"}, {"s": "lesnar", "t": "И я подарил парню, который никогда не поднимется до моего уровня, победу, которой он не заслужил.", "c": 0, "p": 2, "ch": "Предисловие"}, {"s": "booker", "t": "Эта издевательская усмешка, в принципе была оправдана — облупившаяся краска, лысые покрышки, странная проволока вместо антенны.", "c": 13, "p": 24, "ch": "Глава 12. Создание персонажа"}, {"s": "booker", "t": "Я видел парней с большими машинами в дорогих шубах, с золотом на шее и бриллиантами на пальцах, и иногда мне казалось, что таким же стану и я.", "c": 6, "p": 12, "ch": "Глава 5. Из огня да в полымя"}, {"s": "booker", "t": "Я забрался в пустой дом, утащил два килограмма травы, представляя себя Робин Гудом: я отбирал у богатого ямайца и помогал бедному мне.", "c": 11, "p": 49, "ch": "Глава 10. Долгожданная свобода"}, {"s": "booker", "t": "Он всегда с восторгом наблюдал, как я разогревал лапшу с курицей и сыром, и все получалось весьма съедобным.", "c": 12, "p": 4, "ch": "Глава 11. Все на своих местах"}, {"s": "booker", "t": "Он не обращал на меня внимания, потому что я был в наушниках, но парень все больше оживлялся и злился.", "c": 8, "p": 46, "ch": "Глава 7. Рождение Сына"}, {"s": "booker", "t": "Я провел в Хантсвилле не больше недели, но я в полной мере прочувствовал разницу между настоящей тюрьмой и тем заведением в округе Харрис.", "c": 2, "p": 40, "ch": "Глава 1. С улиц за решетку"}, {"s": "booker", "t": "Впервые в жизни я чувствовал, что кирпичик за кирпичиком я выстраиваю фундамент для своей взрослой жизни.", "c": 8, "p": 1, "ch": "Глава 7. Рождение Сына"}, {"s": "booker", "t": "Когда назревал конфликт, парни выстраивались друг против друга в две линии, или же собирались в большой круг.", "c": 11, "p": 3, "ch": "Глава 10. Долгожданная свобода"}, {"s": "booker", "t": "Это был очередной темный момент моей жизни, и его приглашение наполнило мое сердце такой важной для меня надеждой.", "c": 7, "p": 60, "ch": "Глава 6. Непрекращающаяся борьба"}, {"s": "booker", "t": "Мне казалось, что я записался на какие-то странные курсы, причем впервые в жизни учителя меня поддерживали!", "c": 10, "p": 12, "ch": "Глава 9. Внутри системы"}, {"s": "booker", "t": "Мы не виделись больше двух лет — с того дня, когда меня отстранили от занятий в конце моего первого восьмого класса.", "c": 7, "p": 19, "ch": "Глава 6. Непрекращающаяся борьба"}, {"s": "booker", "t": "Такова была участь многих рестлеров тех времен, однако это были неплохие деньги и засветка на телевизионных шоу!", "c": 13, "p": 11, "ch": "Глава 12. Создание персонажа"}, {"s": "booker", "t": "Сестры считали, что из-за этого нам с Бонитой пришлось бы переехать в другой конец штата, а это навредило бы нашей семье.", "c": 5, "p": 7, "ch": "Глава 4. Сам по себе"}, {"s": "booker", "t": "Без сомнений, зрители полностью поверили нам, поскольку то, что они увидели, было больше похоже на попытку предумышленного убийства, в которой «Убийца»", "c": 14, "p": 14, "ch": "Глава 13. Только вперед!"}, {"s": "holly", "t": "Эпоха Хогана была больше похожа на мультфильм, поэтому никто не мог по-настоящему понять этих персонажей.", "c": 18, "p": 1, "ch": "Глава 17. И пробил час"}, {"s": "holly", "t": "Это сильно отличалось от моей работы в рестлинге, хотя мне и приходилось рано вставать и много ждать, работая в WWE, это была не барная пятница, и я всегда мог найти, чем заняться.", "c": 6, "p": 14, "ch": "Глава 5. Борьба за еду и подгузники"}, {"s": "holly", "t": "После всего того, что обо мне писали — что-то справедливо, что-то несправедливо — по крайней мере, теперь у меня появился шанс рассказать «Хардкорную правду».", "c": 37, "p": 18, "ch": "Глава 36. Как я вам теперь нравлюсь?"}, {"s": "holly", "t": "Я считал это не очень удачным решением: ведь незадолго до большого матча на крупном PPV он одержал бы очень быструю победу, и это всем давало понять, что у меня нет никаких шансов.", "c": 33, "p": 40, "ch": "Глава 32. Спина Боба…. Нужны 25 швов"}, {"s": "holly", "t": "Чем больше мы узнавали о жизни друг друга, тем больше мы понимали как иронично было наше положение.", "c": 37, "p": 13, "ch": "Глава 36. Как я вам теперь нравлюсь?"}, {"s": "holly", "t": "Я всегда очень сильно заботился о своих мотоциклах; после каждой поездки я тратил два или три часа, иногда до полудня, следя за тем, чтобы они были безупречны.", "c": 4, "p": 11, "ch": "Глава 3. Жажда скорости"}, {"s": "holly", "t": "Я приехал в Милуоки на записи тв шоу, ко мне подошел Брюс Причард и сказал: «Ты больше не Большая шишка — теперь у тебя есть двоюродный брат».", "c": 21, "p": 4, "ch": "Глава 20. Большая Шишка и Семьянин"}, {"s": "holly", "t": "Впервые они представляли собой настоящую конкуренцию, и у них был агрессивный босс в лице Эрика Бишоффа, который хотел доказать, что может победить Винса.", "c": 14, "p": 2, "ch": "Глава 13. Топтаться на месте"}, {"s": "holly", "t": "Теперь мне требуется гораздо больше времени, чтобы восстановиться после матчей, поэтому до дальнейшего приглашения я буду считать себя счастливым пенсионером.", "c": 36, "p": 17, "ch": "Глава 35. Флирт с Инди"}, {"s": "holly", "t": "Это было довольно приятно, но это определенно не те деньги, которые, по мнению большинства людей, зарабатывает борец из WWF.", "c": 16, "p": 13, "ch": "Глава 15. И началась война"}, {"s": "holly", "t": "Я снова заверил его, что все продам и верну ему деньги, но он просто сказал, что хочет оставить все мне.", "c": 14, "p": 16, "ch": "Глава 13. Топтаться на месте"}, {"s": "holly", "t": "Мик такой упрямый, что ты не можешь вбить ему в голову правду, так что, должно быть, его убило то, что он заплатил мне эти деньги.", "c": 23, "p": 26, "ch": "Глава 22. Золотые времена"}, {"s": "holly", "t": "Любой прохожий мог стать чемпионом, пусть даже изначально мы считались элитной группой атлетов, в которой только самые сильные выигрывают этот титул.", "c": 23, "p": 29, "ch": "Глава 22. Золотые времена"}, {"s": "holly", "t": "Теперь я знал, что могу постоять за себя в бою и что я довольно сильный, и я все больше думал о рестлинге.", "c": 6, "p": 20, "ch": "Глава 5. Борьба за еду и подгузники"}, {"s": "booker-royalty", "t": "Но когда я подумал о том, во что превратилась моя жизнь, о том, что хотел бы еще раз выйти на ринг, я согласился.", "c": 20, "p": 33, "ch": "Глава 20. Возвращение Брэндона"}, {"s": "booker-royalty", "t": "Он появляется на шоу WWE, но при этом ведет и свой небольшой промоушн в Техасе, поскольку очень любит рестлинг.", "c": 0, "p": 7, "ch": "Предисловие"}, {"s": "booker-royalty", "t": "Я давно понял, что бег в канаты — это самая неправдоподобная часть рестлинга, и в тот день мои мысли разделяли все собравшиеся зрители.", "c": 8, "p": 10, "ch": "Глава 8. Шанс посреди хаоса"}, {"s": "booker-royalty", "t": "Я был готов принять честь встать в один ряд с лучшими исполнителями прошлого и настоящего, которые, по мнению WWE, формировали образ компании и представляли ее для всего мира.", "c": 22, "p": 112, "ch": "Глава 26. Зал Славы"}, {"s": "booker-royalty", "t": "Как только это произошло, я понял, что травма серьезная, однако продолжил выступления в течение нескольких месяцев — в том числе и во время той Серии До 4х побед.", "c": 9, "p": 46, "ch": "Глава 9. До четырех побед"}, {"s": "booker-royalty", "t": "Постепенно нас выстраивали как команду, которая может выдержать любое напряжение, и двигали к нашей заветной цели — командному чемпионскому золоту!", "c": 5, "p": 20, "ch": "Глава 5. Командное золото"}, {"s": "booker-royalty", "t": "Я осознал, что она была недостающим звеном в моей жизни, и иногда подумывал о строительстве совместной жизни.", "c": 18, "p": 45, "ch": "Глава 18. Заперт в клетке"}, {"s": "booker-royalty", "t": "Благодаря связям WCW, мне удалось получить очень хорошие места, так что мы отправились на уик-енд, который должен был еще больше укрепить наши с ним отношения.", "c": 7, "p": 19, "ch": "Глава 7. Уход Сестры"}, {"s": "booker-royalty", "t": "Я придумал добавить в костюмы такой элемент как большое пластиковое кольцо, которое находилось на груди и соединяло основную часть комбинезона с лямками.", "c": 4, "p": 28, "ch": "Глава 4. Ухо Кактуса Джека"}, {"s": "booker-royalty", "t": "А после шоу Скорпио пригласил меня в свой уютный домик, где на рождественский ужин собралась вся его огромная семья!", "c": 4, "p": 10, "ch": "Глава 4. Ухо Кактуса Джека"}, {"s": "booker-royalty", "t": "Но затем выбежал судья WWF Майк Киода, который предъявил претензии Нику, что позволило Року прийти в себя, провести мне «Подножье скалы» и сохранить Большой золотой пояс.", "c": 15, "p": 10, "ch": "Глава 15. Дорога на WrestleMania"}, {"s": "booker-royalty", "t": "Он сказал, что несмотря на зафиксированную судьей победу Билла я сохраняю Чемпионский титул, поскольку не был удержан и не сдался.", "c": 12, "p": 80, "ch": "Глава 12. Чемпион волею случая"}, {"s": "booker-royalty", "t": "Который позже и оказался в центре внимания, одержав победу после того, как мой брат сдался в его Стойке Пытки.", "c": 7, "p": 76, "ch": "Глава 7. Уход Сестры"}, {"s": "booker-royalty", "t": "Каин выбросил меня через третий канат, но я вернулся обратно и элиминировал Большого Монстра, отомстив ему.", "c": 22, "p": 37, "ch": "Глава 26. Зал Славы"}];
(()=>{const by=Object.fromEntries(BOOKS.map(b=>[b.slug,b])),track=document.getElementById('qtrack'),cnt=document.getElementById('qcount'),bg=document.getElementById('qbg');
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function deck(){const g={};shuf(QUOTES).forEach(q=>(g[q.s]=g[q.s]||[]).push(q));const keys=Object.keys(g),out=[];
 for(let r=0;;r++){let any=false;for(const k of shuf(keys))if(g[k][r]){out.push(g[k][r]);any=true}if(!any)break}return out}
let list=[],cur=0,io=null;
const size=t=>t.length>230?'xs':t.length>150?'s':t.length>80?'m':'l';
function build(){list=deck();
 track.innerHTML=list.map((q,i)=>{const b=by[q.s];return `<article class="qs-slide" data-i="${i}" aria-label="Цитата ${i+1} из ${list.length}"><div class="qs-in"><blockquote class="${size(q.t)}"><p>${esc(q.t)}</p></blockquote>
<footer><img src="../covers/${q.s}.webp" alt="" width="44" height="66" loading="lazy"><cite><b>${esc(b.author)}</b>«${esc(b.title)}»</cite></footer>
<div class="qs-act"><a class="btn big" href="../${q.s}/#read/${q.c}/${q.p}">Читать в книге</a><button class="icon" data-share="${i}" aria-label="Поделиться цитатой"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4m-4 4 4-4 4 4M6 12v6.5c0 .8.7 1.5 1.5 1.5h9c.8 0 1.5-.7 1.5-1.5V12"/></svg></button></div></div></article>`}).join('');
 if(io)io.disconnect();io=new IntersectionObserver(es=>{for(const e of es)if(e.isIntersecting&&e.intersectionRatio>.6)setCur(+e.target.dataset.i)},{root:track,threshold:[.6]});
 track.querySelectorAll('.qs-slide').forEach(s=>io.observe(s));track.scrollTo({left:0});setCur(0)}
function fit(el){if(!el)return;const bq=el.querySelector('blockquote'),inn=el.querySelector('.qs-in');bq.style.fontSize='';let fs=parseFloat(getComputedStyle(bq).fontSize),n=0;while(inn.scrollHeight>inn.clientHeight+1&&fs>15&&n++<40){fs-=1;bq.style.fontSize=fs+'px'}}
function setCur(i){cur=i;fit(track.children[i]);cnt.textContent=(i+1)+' / '+list.length;const q=list[i];if(q&&bg.dataset.s!==q.s){bg.dataset.s=q.s;bg.style.backgroundImage=`url(../covers/${q.s}.webp)`}
 try{if(navigator.userActivation&&navigator.userActivation.hasBeenActive&&navigator.vibrate&&matchMedia('(pointer:coarse)').matches)navigator.vibrate(4)}catch(e){}}
const go=d=>{const n=Math.max(0,Math.min(list.length-1,cur+d));track.children[n].scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',inline:'center',block:'nearest'})};
document.getElementById('qprev').onclick=()=>go(-1);document.getElementById('qnext').onclick=()=>go(1);
document.getElementById('qshuf').onclick=()=>{build();toast('Колода перемешана')};
addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();go(1)}else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();go(-1)}});
function toast(t){let n=document.getElementById('toast');if(!n){n=document.createElement('div');n.id='toast';n.setAttribute('role','status');document.body.append(n)}n.textContent=t;n.classList.add('on');clearTimeout(n._t);n._t=setTimeout(()=>n.classList.remove('on'),2200)}
track.addEventListener('click',async e=>{const b=e.target.closest('[data-share]');if(!b)return;const q=list[+b.dataset.share],a=by[q.s],url=location.origin+location.pathname.replace(/quotes\/$/,'')+q.s+'/#read/'+q.c+'/'+q.p,text='«'+q.t+'» — '+a.author+', «'+a.title+'»';
 try{if(navigator.share){await navigator.share({text,url});return}}catch(err){if(err&&err.name==='AbortError')return}
 try{await navigator.clipboard.writeText(text+'\n'+url);toast('Цитата скопирована')}catch(err){toast('Не удалось скопировать')}});
build();addEventListener('resize',()=>fit(track.children[cur]));document.fonts&&document.fonts.ready.then(()=>fit(track.children[cur]))})();

</script>
