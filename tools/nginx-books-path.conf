# Вариант для nginx: сайт живёт в подпапке vsplanet.net/books/.
# Вставить ВНУТРЬ существующего server { … } для vsplanet.net (443). Корневой «location /» WordPress не трогаем.
# Файлы из архива — в <корень сайта>/books/ (например /var/www/vsplanet.net/books/).
set $books_csp "default-src 'self'; script-src 'self' 'unsafe-inline' https://mc.yandex.ru https://mc.yandex.com https://yastatic.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://mc.yandex.ru https://mc.yandex.com; font-src 'self'; connect-src 'self' https://mc.yandex.ru https://mc.yandex.com wss://mc.yandex.ru wss://mc.yandex.com; child-src blob: https://mc.yandex.ru https://www.youtube-nocookie.com; frame-src blob: https://mc.yandex.ru https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self' https://vsplanet.net https://*.vsplanet.net https://metrika.yandex.ru https://webvisor.com https://*.webvisor.com";
location ^~ /books/ {
    index index.html;
    charset utf-8;
    error_page 404 /books/404.html;
    autoindex off;
    types { application/manifest+json webmanifest; application/epub+zip epub; }
    include mime.types;

    set $cc "no-cache";
    if ($uri ~ "\.(webp|jpg|jpeg|png|svg|ico)$") { set $cc "public, max-age=2592000"; }
    if ($uri ~ "-[0-9a-f]{8,12}\.(js|css|json|epub|txt|woff2)$") { set $cc "public, max-age=31536000, immutable"; }
    add_header Cache-Control $cc always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy $books_csp always;

    gzip on;
    gzip_types text/css text/plain text/xml application/xml application/javascript application/json application/manifest+json image/svg+xml;

    rewrite ^/books/(.*/)?index\.html$ /books/$1 permanent;
    rewrite ^/books/shelf/?$ /books/ permanent;
    try_files $uri $uri/ =404;      # не передавать неизвестные адреса в WordPress
}
