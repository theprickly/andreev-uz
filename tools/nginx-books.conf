# Вариант для nginx (если сервер не на Apache). Сертификат: certbot --nginx -d books.vsplanet.net
server {
    listen 80;
    server_name books.vsplanet.net;
    return 301 https://books.vsplanet.net$request_uri;
}
server {
    listen 443 ssl http2;
    server_name books.vsplanet.net;
    root /var/www/books.vsplanet.net;   # папка с содержимым site/
    index index.html;
    charset utf-8;
    error_page 404 /404.html;
    autoindex off;

    include mime.types;
    types { application/manifest+json webmanifest; application/epub+zip epub; }

    gzip on;
    gzip_types text/css text/plain text/xml application/xml application/javascript application/json application/manifest+json image/svg+xml;
    # brotli on; brotli_types <те же типы>;   # если собран модуль ngx_brotli

    set $csp "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self' https://vsplanet.net https://*.vsplanet.net";
    set $cc "no-cache";
    if ($uri ~ "\.(webp|jpg|jpeg|png|svg|ico)$") { set $cc "public, max-age=2592000"; }
    if ($uri ~ "-[0-9a-f]{8,12}\.(js|css|json|epub|txt|woff2)$") { set $cc "public, max-age=31536000, immutable"; }

    add_header Cache-Control $cc always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy $csp always;

    # один адрес у каждой страницы
    rewrite ^/(.*/)?index\.html$ /$1 permanent;
    rewrite ^/shelf/?$ / permanent;

    location / { try_files $uri $uri/ =404; }
    location ~ /\.ht { deny all; }
}
